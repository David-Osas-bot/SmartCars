        <!-- Brand, newsletter, contact -->
            <div>
                <a href="/" aria-label="SmartCars home" class="inline-flex items-center gap-2.5 text-xl font-semibold tracking-tight">
                    <span class="flex h-10 w-10 items-center justify-center rounded-lg bg-white text-sm font-bold text-black">SC</span>

                                class="h-[55px] shrink-0 rounded-lg bg-white px-6 text-base font-medium text-black transition hover:bg-neutral-200">
                            Subscribe

                    </div>
                    <p data-newsletter-msg role="status" aria-live="polite"
                       class="mt-3 hidden text-sm text-neutral-400 data-[error=true]:text-red-400"></p>
                </form>

                <address class="mt-8 text-[17px] not-italic leading-[1.75] text-neutral-400">

                    <a href="tel:+2348007627848" class="transition hover:text-white">+234 800 762 7848</a>
                    · <a href="mailto:hello@smartcars.ng" class="transition hover:text-white">hello@smartcars.ng</a>
                </address>

            <!-- Link columns (filled by main.js) -->
            <nav id="footerNav" aria-label="Footer" class="grid grid-cols-2 gap-10 sm:grid-cols-3 lg:pt-2"></nav>

            <ul id="footerPayments" aria-label="Accepted payment methods" class="flex flex-wrap gap-2.5"></ul>
            <ul id="footerSocials" class="flex items-center gap-5"></ul>
        </div>
    </div>
